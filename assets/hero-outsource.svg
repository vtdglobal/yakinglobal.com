  <g fill="#9b7bff">
    <path d="M520 120 l10 0 2 -10 10 -2 5 -9 -6 -8 6 -8 -5 -9 -10 -2 -2 -10 -10 0 -2 10 -10 2 -5 9 6 8 -6 8 5 9 10 2z" opacity="0.9" transform="translate(0,20)"/>
