    <circle cx="186" cy="111" r="6" fill="#28c840"/>
    <rect x="210" y="102" width="180" height="18" rx="9" fill="#0d1a2e"/>
    <rect x="222" y="108" width="90" height="6" rx="3" fill="#2a4a74"/>

    <!-- code lines -->
    <rect x="145" y="152" width="30" height="10" rx="5" fill="#0f8aff"/>
    <rect x="183" y="152" width="90" height="10" rx="5" fill="#2a4a74"/>
    <rect x="160" y="174" width="55" height="10" rx="5" fill="#9b7bff"/>
    <rect x="223" y="174" width="70" height="10" rx="5" fill="#2a4a74"/>
