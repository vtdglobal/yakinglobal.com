    <circle cx="98" cy="258" r="18" fill="#9b7bff"/>
    <circle cx="98" cy="258" r="18" fill="none" stroke="#0d1a2e" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="126" y="246" width="42" height="8" rx="4" fill="#2a4a74"/>
    <rect x="126" y="262" width="30" height="8" rx="4" fill="#2a4a74"/>
    <rect x="80" y="292" width="84" height="8" rx="4" fill="#2a4a74"/>
