  <circle cx="525" cy="112" r="9" fill="#0e1c30"/>
  <text x="80" y="150" font-family="monospace" font-size="44" font-weight="bold" fill="#0f8aff" opacity="0.9">&lt;/&gt;</text>
  <text x="490" y="220" font-family="monospace" font-size="30" font-weight="bold" fill="#9b7bff" opacity="0.8">{ }</text>

  <!-- dots -->
  <g fill="#0f8aff" opacity="0.5">
    <circle cx="100" cy="80" r="4"/><circle cx="560" cy="300" r="4"/><circle cx="90" cy="400" r="4"/>
    <circle cx="580" cy="160" r="3"/><circle cx="300" cy="380" r="3"/><circle cx="520" cy="440" r="3"/>
