    <!-- chart panel inside window -->
    <rect x="330" y="150" width="128" height="105" rx="10" fill="#0d1a2e" stroke="#2a4a74"/>
    <polyline points="344,232 368,208 388,218 412,186 444,170" stroke="#0f8aff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="444" cy="170" r="5" fill="#0f8aff"/>
    <rect x="344" y="164" width="52" height="8" rx="4" fill="#2a4a74"/>

